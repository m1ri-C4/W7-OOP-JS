<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-libreria — Settimana VII Giorno I</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <h1>La mia libreria</h1>
    <p>Aggiungi i tuoi libri e segnali come letti.</p>
  </header>

  <main class="container">

    <section id="form-section" class="container bg-body mt-5">
      <!-- form per aggiungere un libro: titolo, autore, anno, formato (cartaceo/digitale) -->
      <h2 class="fw-bold mb-3">Aggiungi un libro</h2>
      <form id="register">

        <div class="col">

          <label for="newTitle" class="form-label fw-bold">Titolo</label>
          <input type="text" id="newTitle" class="form-control" />

          <label for="newAuthor" class="form-label fw-bold">Autore</label>
          <input type="text" id="newAuthor" class="form-control" />


          <label for="newYear" class="form-label fw-bold">Anno</label>
          <input type="number" id="newYear" class="form-control" />

          <label for="newFormat" class="form-label fw-bold">Formato</label>
          <select id="newFormat" class="form-select">
            <option value="C">Cartaceo</option>
            <option value="D">Digitale</option>
          </select>

          <div class="campo campo-condizionale" id="campo-dimensione" hidden>
            <label for="dimensione" class="form-label fw-bold">Dimensione (MB)</label>
            <input type="number" id="dimensione" name="dimensione" step="0.1">
          </div>

          <button type="submit" class="btn btn-primary w-25 mt-3"> Aggiungi</button>

        </div>
      </form>
    </section>

    <section class="lista-section">
      <h2 class="fw-bold m-4">
        I tuoi libri (<span id="booksCount">0</span>)
      </h2>

      <ul id="booksList" class="list-group list-unstyled"></ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>

</html>
